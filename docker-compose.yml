version: "3.8"

services:
  app:
    build: .
    ports:
      - "3007:3007"
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongo:27017/airbnb
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
